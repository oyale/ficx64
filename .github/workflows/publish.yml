name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Construir el HTML para GitHub Pages
        env:
          FICX_PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 build.py --site-url "$FICX_PAGES_URL"
      - name: Comprobar que los datos están dentro
        run: |
          set -e
          ! grep -q "window.FICX_FILMS = \[\];" dist/index.html
          ! grep -q "window.FICX_SCREENINGS = \[\];" dist/index.html
          test -s dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
